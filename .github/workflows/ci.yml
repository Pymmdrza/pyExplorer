name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX installers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          bash -n scripts/linux/setup.sh scripts/linux/run.sh
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash -n scripts/macos/setup.command
          fi
          sh scripts/install.sh --help > /dev/null
      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            'scripts/install.ps1',
            'scripts/windows/setup.ps1',
            'scripts/windows/run.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Lint backend
        run: python -m ruff check backend/src backend/tests
      - name: Test backend
        run: python -m pytest backend --cov=pyexplorer_api --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e ./backend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Start application
        run: |
          python run.py --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
      - name: Verify application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null
      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log

  container:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build optional container
        run: docker compose build
