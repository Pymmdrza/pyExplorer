name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installers:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Validate dependency policy
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test ! -f frontend/package-lock.json
          needle="$(printf 'npm %s' 'ci')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pyexplorer-runtime "$needle" .; then
            echo 'Disallowed clean-install command found.' >&2
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pyexplorer-runtime '@fontsource/' frontend; then
            echo 'Font package dependencies are not allowed; fonts must load through Google Fonts.' >&2
            exit 1
          fi
          grep -Fq 'https://fonts.googleapis.com' frontend/index.html
          grep -Fq 'https://fonts.gstatic.com' frontend/index.html
          grep -Fq 'family=IBM+Plex+Mono' frontend/index.html
          grep -Fq 'family=IBM+Plex+Sans' frontend/index.html
      - name: Validate dependency policy on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'frontend/package-lock.json') {
            throw 'frontend/package-lock.json must not be committed.'
          }
          $needle = 'npm ' + 'ci'
          $offenders = Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](?:\.git|node_modules|\.pyexplorer-runtime)[\\/]' } |
            Select-String -SimpleMatch $needle
          if ($offenders) {
            $offenders | ForEach-Object { Write-Error $_.Path }
            throw 'Disallowed clean-install command found.'
          }
          $fontPackages = Get-ChildItem frontend -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            Select-String -SimpleMatch '@fontsource/'
          if ($fontPackages) {
            $fontPackages | ForEach-Object { Write-Error $_.Path }
            throw 'Font package dependencies are not allowed.'
          }
          $index = Get-Content frontend/index.html -Raw
          foreach ($required in @('https://fonts.googleapis.com', 'https://fonts.gstatic.com', 'family=IBM+Plex+Mono', 'family=IBM+Plex+Sans')) {
            if (-not $index.Contains($required)) {
              throw "Missing required Google Fonts declaration: $required"
            }
          }
      - name: Validate POSIX installers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          bash -n scripts/linux/setup.sh scripts/linux/run.sh scripts/linux/dev.sh scripts/linux/test.sh
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash -n scripts/macos/setup.command
          fi
          sh scripts/install.sh --help > /dev/null
          manifest="$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt)"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            platform="${target%-*}"
            arch="${target#*-}"
            node_file="$(printf '%s\n' "$manifest" | awk -v platform="$platform" -v arch="$arch" '$2 ~ ("^node-v[0-9.]+-" platform "-" arch "\\.tar\\.gz$") { print $2; exit }')"
            test -n "$node_file"
          done
      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            'scripts/install.ps1',
            'scripts/windows/setup.ps1',
            'scripts/windows/run.ps1',
            'scripts/windows/dev.ps1',
            'scripts/windows/test.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          $manifest = (Invoke-WebRequest -UseBasicParsing -Uri 'https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt').Content
          foreach ($arch in @('x64', 'arm64')) {
            $pattern = '(?m)^[a-fA-F0-9]{64}\s+(node-v[0-9.]+-win-' + [regex]::Escape($arch) + '\.zip)$'
            if (-not [regex]::IsMatch($manifest, $pattern)) {
              throw "Node.js manifest did not contain a Windows $arch runtime."
            }
          }

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Lint backend
        run: python -m ruff check backend/src backend/tests
      - name: Test backend
        run: python -m pytest backend --cov=pyexplorer_api --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend
        run: npm install --no-audit --no-fund --package-lock=false --progress=false
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend
        run: python -m pip install -e ./backend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --package-lock=false --progress=false
          npm run build
      - name: Start application
        run: |
          python run.py --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
      - name: Verify application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null
      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log

  container:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build optional container
        run: docker compose build
