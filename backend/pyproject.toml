[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pyexplorer-api"
version = "0.1.0"
description = "Modern FastAPI backend for the pyExplorer Bitcoin blockchain explorer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "httpx==0.28.1",
    "orjson==3.10.18",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "uvicorn[standard]==0.34.3",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyexplorer_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]